<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Forum</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: var(--bg);
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
      --shadow-md:    0 4px 12px rgba(0,0,0,.1);
      --red:    var(--hub-tint-danger-fg, #dc2626); --red-light:   var(--hub-tint-danger, #fee2e2);
      --green:  #059669; --green-light: #d1fae5;
      --amber:  #d97706;
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }

    .app { max-width: 720px; margin: 0 auto; padding: 16px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; border: none;
      transition: opacity .15s, background .15s; text-decoration: none;
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--hub-primary-fg, #fff); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border-mid); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
    .btn-xs { padding: 3px 8px; font-size: 0.75rem; }

    /* ── Cards ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }

    /* ── Page header ── */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
    }
    .page-header h1 { font-size: 1.25rem; font-weight: 700; }
    .page-header .header-actions { display: flex; gap: 8px; align-items: center; }

    /* ── Category tabs ── */
    .category-tabs {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .cat-tab {
      padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; border: 2px solid transparent; transition: all .15s;
      background: var(--accent-light); color: var(--muted);
    }
    .cat-tab.active { color: #fff; border-color: transparent; }
    .cat-tab:not(.active):hover { border-color: var(--border-mid); }

    /* ── Thread list ── */
    .thread-list { display: flex; flex-direction: column; gap: 8px; }

    .thread-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      cursor: pointer; transition: box-shadow .15s, border-color .15s;
    }
    .thread-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-mid); }
    .thread-card-inner { padding: 14px 16px; }

    .thread-title {
      font-weight: 700; font-size: 1rem; margin-bottom: 4px; line-height: 1.35;
      display: flex; align-items: center; gap: 6px;
    }
    .pin-icon { font-size: 0.85rem; }
    .thread-preview {
      font-size: 0.85rem; color: var(--muted); margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .thread-meta {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      font-size: 0.78rem; color: var(--muted);
    }
    .thread-meta .sep { color: var(--border-mid); }

    /* ── Badges ── */
    .badge {
      display: inline-block; padding: 1px 8px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; color: #fff;
    }
    .badge-muted { background: #e5e7eb; color: var(--muted); }

    /* ── Thread detail ── */
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.82rem; color: var(--accent); cursor: pointer;
      background: none; border: none; padding: 0; margin-bottom: 12px; font-weight: 600;
    }
    .back-btn:hover { opacity: .75; }

    .thread-detail-header {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-bottom: 10px;
      box-shadow: var(--shadow);
    }
    .thread-detail-title {
      font-size: 1.2rem; font-weight: 700; line-height: 1.35; margin-bottom: 8px;
    }
    .thread-detail-meta {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      font-size: 0.82rem; color: var(--muted); margin-bottom: 12px;
    }
    .thread-detail-actions {
      display: flex; gap: 6px; margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    /* ── Markdown body ── */
    .md-body { font-size: 0.92rem; line-height: 1.65; color: var(--text); }
    .md-body h1 { font-size: 1.3rem; font-weight: 700; margin: 14px 0 6px; }
    .md-body h2 { font-size: 1.1rem; font-weight: 700; margin: 12px 0 5px; }
    .md-body h3 { font-size: 1rem;   font-weight: 700; margin: 10px 0 4px; }
    .md-body p  { margin: 6px 0; }
    .md-body ul, .md-body ol { margin: 6px 0 6px 20px; }
    .md-body li { margin: 2px 0; }
    .md-body blockquote {
      border-left: 3px solid var(--border-mid); padding-left: 12px;
      color: var(--muted); margin: 8px 0; font-style: italic;
    }
    .md-body code {
      background: var(--accent-light); border-radius: 4px;
      padding: 1px 5px; font-size: 0.85em; font-family: monospace;
    }
    .md-body pre {
      background: #1e293b; color: #e2e8f0; border-radius: 8px;
      padding: 14px 16px; overflow-x: auto; margin: 8px 0;
    }
    .md-body pre code { background: none; padding: 0; color: inherit; font-size: 0.88em; }
    .md-body a { color: var(--accent); text-decoration: underline; }
    .md-body strong { font-weight: 700; }
    .md-body em { font-style: italic; }
    .md-body s { text-decoration: line-through; opacity: .75; }

    /* ── Reactions ── */
    .reactions {
      display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px;
    }
    .reaction-btn {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 3px 9px; border-radius: 20px; font-size: 0.82rem;
      border: 1.5px solid var(--border); background: var(--card);
      cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .reaction-btn:hover { border-color: var(--accent); background: var(--accent-light); }
    .reaction-btn.reacted { background: var(--accent-light); border-color: var(--accent); font-weight: 700; }
    .reaction-add {
      padding: 3px 9px; border-radius: 20px; font-size: 0.82rem;
      border: 1.5px dashed var(--border-mid); background: transparent;
      cursor: pointer; color: var(--muted); transition: all .15s; font-family: inherit;
    }
    .reaction-add:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Emoji picker ── */
    .emoji-picker {
      display: inline-flex; gap: 4px; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px;
      box-shadow: var(--shadow-md); align-items: center;
    }
    .emoji-opt {
      font-size: 1.1rem; cursor: pointer; padding: 2px 4px;
      border-radius: 4px; border: none; background: transparent;
      transition: background .1s;
    }
    .emoji-opt:hover { background: var(--accent-light); }

    /* ── Replies ── */
    .replies-section { margin-top: 10px; }
    .replies-header {
      font-size: 0.78rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
      padding: 0 0 8px; margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .reply-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px;
    }
    .reply-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 800; color: white;
    }
    .reply-author { font-size: 0.82rem; font-weight: 600; }
    .reply-date   { font-size: 0.75rem; color: var(--muted); }
    .reply-delete {
      margin-left: auto; opacity: 0; font-size: 0.75rem; color: var(--red);
      background: none; border: none; cursor: pointer; padding: 2px 6px;
      border-radius: 4px; transition: opacity .15s;
    }
    .reply-card:hover .reply-delete { opacity: 1; }
    .reply-delete:hover { background: var(--red-light); }

    /* ── Reply form ── */
    .reply-form {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px; margin-top: 8px;
    }
    .reply-form h4 { font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; }

    /* ── Markdown editor ── */
    .md-editor { position: relative; }
    .md-editor textarea {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 10px 12px; font-size: 0.88rem; font-family: monospace;
      resize: vertical; min-height: 90px; outline: none; line-height: 1.55;
      transition: border-color .15s;
    }
    .md-editor textarea:focus { border-color: var(--accent); }
    .md-toolbar {
      display: flex; gap: 5px; margin-bottom: 5px; flex-wrap: wrap;
    }
    .md-toolbar button {
      padding: 3px 8px; font-size: 0.75rem; border: 1px solid var(--border-mid);
      border-radius: 4px; background: var(--card); cursor: pointer;
      color: var(--muted); font-family: inherit; transition: all .12s;
    }
    .md-toolbar button:hover { border-color: var(--accent); color: var(--accent); }
    .md-toolbar .sep-v { width: 1px; background: var(--border-mid); margin: 0 2px; }
    .md-preview-area {
      border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 10px 12px; min-height: 90px; font-size: 0.88rem;
    }
    .preview-toggle {
      font-size: 0.75rem; color: var(--muted); cursor: pointer;
      background: none; border: none; padding: 0; margin-bottom: 5px;
      display: block; font-family: inherit;
    }
    .preview-toggle:hover { color: var(--accent); }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center; z-index: 100;
    }
    @media (min-width: 540px) { .modal-backdrop { align-items: center; padding: 20px; } }
    .modal {
      background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
      width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; padding: 24px;
    }
    @media (min-width: 540px) { .modal { border-radius: var(--radius); } }
    .modal h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; }

    /* ── Form ── */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: var(--muted); margin-bottom: 4px;
    }
    .form-group input[type="text"],
    .form-group select,
    .form-group textarea {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 8px 12px; font-size: 0.9rem; outline: none;
      transition: border-color .15s; font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 120px; line-height: 1.55; }
    .form-group input:focus, .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .reply-form textarea { width: 100%; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions .btn { flex: 1; justify-content: center; }

    .avatar-lg {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 800; color: white;
    }

    /* ── Settings ── */
    .cat-row {
      display: flex; align-items: center; gap: 8px; padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .cat-row:last-child { border-bottom: none; }
    .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .cat-name-input {
      flex: 1; border: 1px solid var(--border-mid); border-radius: 6px;
      padding: 4px 8px; font-size: 0.85rem; font-family: inherit; outline: none;
    }
    .cat-name-input:focus { border-color: var(--accent); }
    .color-swatches { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .swatch {
      width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: border-color .1s;
    }
    .swatch.selected { border-color: var(--text); }

    /* ── Empty / loading ── */
    .empty { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 0.9rem; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .loading { text-align: center; padding: 48px; color: var(--muted); }
    .error-msg {
      background: var(--red-light); color: var(--red); border-radius: 8px;
      padding: 9px 13px; font-size: 0.85rem; margin-bottom: 12px;
    }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
  </style>
<base href="/run/forum/">

<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { createDbHelper, hubAlert, memberColor, initial, esc, isAdult, formatRelativeDate, hubConfirm, searchMatch, glyph, chickadee } from "/hub-sdk.js";
import {
  renderMarkdown, applyInline, stripMarkdown,
  groupReactions, hasReacted, reactionSummary, sortThreads, searchableFields, canDeleteReply, canModerateThread,
  safeColor, authorName, createLatestLoader,
} from "./logic.js";

// ── Runtime globals ───────────────────────────────────────────────────────────
const CONTEXT    = window.__CONTEXT_URL ?? "";
const DB         = window.__DB_URL      ?? "";
const APP_ID     = window.__APP_ID      ?? "forum";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
// Where the app is running, for the gates that differ between a household and
// a shared space (see logic.js supervisesReplies, supervisesThreads).
const TENANT = { tenantKind: window.__TENANT_KIND ?? "household", spaceKind: window.__SPACE_KIND ?? null, isAdmin: window.__IS_ADMIN === true };

const REACTION_EMOJIS = ["👍","❤️","😂","😮","🙏","👏"];
const CATEGORY_COLORS = [
  "#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#f97316","#6b7280",
];
const DEFAULT_CATEGORIES = [
  { id: "announcements", name: "Announcements", color: "#3b82f6", position: 0 },
  { id: "planning",      name: "Planning",      color: "#10b981", position: 1 },
  { id: "random",        name: "Random",        color: "#6b7280", position: 2 },
  { id: "questions",     name: "Questions",     color: "#f59e0b", position: 3 },
];

// ── State ─────────────────────────────────────────────────────────────────────
let members        = [];
let currentMember  = null;
let view           = "list";      // "list" | "thread"
let threads        = [];
let currentThread  = null;
let currentReplies = [];
let categories     = [];
let reactions      = {};          // grouped reaction map
let categoryFilter = null;        // null = all
let searchQ = "";       // in-app search (see logic.js searchableFields)
let pickerTarget   = null;        // { targetId, targetType } for emoji picker
let previewMode    = false;       // markdown preview toggle in new-thread modal
let replyPreview   = false;       // preview in reply form

// ── DB helper ─────────────────────────────────────────────────────────────────
// The SDK helper throws on a refused statement (fetch does not reject on 4xx or
// 5xx), and its .batch() sends several statements as one atomic transaction.
const dbq = createDbHelper(DB);

function uuid() { return crypto.randomUUID(); }

// ── Schema setup ──────────────────────────────────────────────────────────────
async function setupSchema() {
  // Schema managed by hub migrations (migrations/001_init.sql)
}

// Thread retention is declared in manifest.json (`row_policies.threads.
// retain_days`) and executed by the hub's daily runner, which cascades to
// replies and to the reactions on both. It replaced a client-side sweep that
// ran an unconfirmed bulk delete on whoever opened the page, under that
// member's own row policies, with a 100-parameter id list that stopped working
// once a household passed ~100 old threads. Admins change the window in the
// hub's app settings; pinned threads are exempt (exempt_when).

// ── Data loading ──────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex",  role: "adult" },
      { id: "demo-2", name: "Jordan", role: "adult" },
      { id: "demo-3", name: "Casey", role: "child" },
      { id: "demo-4", name: "Riley", role: "child" },
    ];
    return;
  }
  // A member list that could not be read is a failed load, not a household with nobody in it.
  const res = await fetch(`${CONTEXT}?keys=family.members`);
  const data = await res.json().catch(() => null);
  if (!res.ok || !data || typeof data !== "object" || data.error || (Array.isArray(data.$errors) && data.$errors.includes("family.members"))) throw new Error("Couldn’t reach the hub. Try again.");
  members = data["family.members"] ?? [];
}

async function loadCategories() {
  // `name` is encrypted at rest, so it can only be ordered after the hub
  // decrypts it — sorting it in SQL would order ciphertext. `position` is in
  // the platform plaintext skip-list and still sorts correctly server-side.
  const { rows } = await dbq(`SELECT * FROM app_forum__categories ORDER BY position`);
  categories = (rows ?? []).sort(
    (a, b) => (a.position ?? 0) - (b.position ?? 0) || (a.name ?? "").localeCompare(b.name ?? "")
  );
}

// Loads the thread list for the filter in force when it is called, and returns
// whether it was kept (logic.js createLatestLoader). An answer that arrives
// after a newer call was made is for a filter the member has left: it is
// dropped before it can replace the list, so no later render shows one
// category's threads under another's tab.
//
// reply_count and reaction_count ride on the thread row. They are NOT written
// by this app: `manifest.write_effects` on `replies` and `reactions` makes the
// hub append a recompute to the same transaction as every insert/delete, run
// with hub authority, and `column_write_acls` marks both columns
// `writable_by: []` so no client can forge one.
//
// This is the un-revert of the counters that were tried and pulled: the bump
// failed because replying and reacting are cross-member acts while `threads`
// is owner_or_visibility, so a non-supervisor's UPDATE got
// `AND author_id = <caller>` appended and matched no row. An effect statement
// bypasses row-policy SCOPING, which is the whole mechanism — do not try to
// maintain these columns from client SQL again, it will silently no-op.
//
// Two hub lanes delete rows without firing effects (retention sweeps and
// member_references removal); the recompute style is what makes both
// self-healing. See migrations/006_write_effect_counters.sql.
const loadThreadsFor = createLatestLoader({
  load: async (filter) => (await dbq(`
    SELECT * FROM app_forum__threads ${filter ? `WHERE category_id = ?` : ""}
    ORDER BY pinned DESC, created_at DESC
  `, filter ? [filter] : [])).rows,
  commit: (_filter, rows) => {
    threads = rows.map(r => ({
      ...r,
      author_name: authorName(r, members),
      pinned: !!r.pinned,
      reply_count: Number(r.reply_count) || 0,
      reaction_count: Number(r.reaction_count) || 0,
    }));
  },
});
const loadThreads = () => loadThreadsFor(categoryFilter);

async function loadThread(id) {
  const [{ rows: tr }, { rows: rp }] = await Promise.all([
    dbq(`SELECT * FROM app_forum__threads WHERE id = ?`, [id]),
    dbq(`SELECT * FROM app_forum__replies WHERE thread_id = ? ORDER BY created_at ASC`, [id]),
  ]);
  currentThread = tr[0] ? { ...tr[0], author_name: authorName(tr[0], members), pinned: !!tr[0].pinned } : null;
  if (!currentThread) return;
  currentReplies = rp.map(r => ({ ...r, author_name: authorName(r, members) }));

  // Load all reactions for the thread and its replies in one query
  const allIds = [id, ...rp.map(r => r.id)];
  const placeholders = allIds.map(() => "?").join(",");
  const { rows: rx } = await dbq(
    `SELECT target_id, target_type, emoji, author_id FROM app_forum__reactions WHERE target_id IN (${placeholders})`,
    allIds
  );
  reactions = groupReactions(rx);
}

// ── Actions ───────────────────────────────────────────────────────────────────
async function toggleReaction(targetId, targetType, emoji) {
  if (!currentMember || !currentThread) return;
  // Every reaction names the thread it sits under, its own or its reply's, so
  // the hub removes them all with the thread (manifest.delete_cascades).
  const threadId = currentThread.id;
  const already = hasReacted(reactions, targetId, emoji, currentMember.id);

  // Optimistic update
  const prevReactions = JSON.parse(JSON.stringify(reactions));
  if (already) {
    const r = reactions[targetId]?.[emoji];
    if (r) {
      r.count--;
      r.authorIds = r.authorIds.filter(id => id !== currentMember.id);
      if (r.count === 0) delete reactions[targetId][emoji];
    }
  } else {
    if (!reactions[targetId]) reactions[targetId] = {};
    if (!reactions[targetId][emoji]) reactions[targetId][emoji] = { count: 0, authorIds: [] };
    reactions[targetId][emoji].count++;
    reactions[targetId][emoji].authorIds.push(currentMember.id);
  }
  pickerTarget = null;
  render();

  try {
    if (already) {
      await dbq(
        `DELETE FROM app_forum__reactions WHERE target_id=? AND emoji=? AND author_id=?`,
        [targetId, emoji, currentMember.id]
      );
    } else {
      await dbq(
        `INSERT INTO app_forum__reactions (id, target_id, target_type, thread_id, emoji, author_id) VALUES (?,?,?,?,?,?)`,
        [uuid(), targetId, targetType, threadId, emoji, currentMember.id]
      );
    }
  } catch (e) {
    reactions = prevReactions;
    render();
    console.error(e);
    hubAlert("Couldn’t save your reaction — try again.");
  }
}

async function togglePin(threadId) {
  const t = threads.find(t => t.id === threadId) ?? currentThread;
  if (!t) return;
  const next = !t.pinned;

  // Optimistic update
  const prevThreads = threads.map(th => ({ ...th }));
  const prevCurrentThread = currentThread ? { ...currentThread } : null;
  threads = threads.map(th => th.id === threadId ? { ...th, pinned: next } : th);
  if (currentThread?.id === threadId) currentThread = { ...currentThread, pinned: next };
  render();

  let refused = null;
  try {
    const { changed } = await dbq(`UPDATE app_forum__threads SET pinned=? WHERE id=?`, [next ? 1 : 0, threadId]);
    // The hub changes nothing, without refusing, on a thread the caller may not write.
    if (changed === 0) throw new Error(refused = next ? "This thread could not be pinned." : "This thread could not be unpinned.");
  } catch (e) {
    threads = prevThreads;
    if (currentThread?.id === threadId) currentThread = prevCurrentThread;
    render();
    if (!refused) console.error(e);
    hubAlert(refused ?? (next ? "Couldn’t pin the thread — try again." : "Couldn’t unpin the thread — try again."));
  }
}

async function deleteThread(threadId) {
  if (!await hubConfirm({ message: "Delete this thread?", description: "The thread and all its replies will be permanently removed.", confirmLabel: "Delete thread", destructive: true })) return;

  // Optimistic: remove from local state and navigate away immediately
  const prevThreads = threads.map(th => ({ ...th }));
  const prevView = view;
  const prevCurrentThread = currentThread ? { ...currentThread } : null;
  const prevCurrentReplies = [...currentReplies];
  threads = threads.filter(t => t.id !== threadId);
  if (currentThread?.id === threadId) {
    view = "list";
    currentThread = null;
    currentReplies = [];
  }
  render();

  try {
    // One statement: `manifest.delete_cascades` has the hub remove the replies
    // and every reaction under the thread, whoever wrote them, in the same
    // transaction. A cascade written here could remove only what the caller
    // may delete, which left other members' reactions behind, and it stopped
    // part-way when a request was lost.
    const { changed } = await dbq(`DELETE FROM app_forum__threads WHERE id = ?`, [threadId]);
    // The hub deletes nothing, without refusing, for a thread the caller may not remove.
    if (changed === 0) throw new Error("not removed");
  } catch {
    threads = prevThreads;
    view = prevView;
    currentThread = prevCurrentThread;
    currentReplies = prevCurrentReplies;
    render();
    hubAlert("This thread could not be deleted.");
  }
}

async function deleteReply(replyId) {
  if (!await hubConfirm({ message: "Delete this reply?", confirmLabel: "Delete", destructive: true })) return;

  // Optimistic: remove from local state immediately
  const prevReplies = [...currentReplies];
  const prevCurrentThread = { ...currentThread };
  currentReplies = currentReplies.filter(r => r.id !== replyId);
  currentThread = { ...currentThread, reply_count: Math.max(0, Number(currentThread.reply_count) - 1) };
  render();

  let refused = null;
  try {
    // The caller's own reactions on the reply go first; other members' stay in
    // the table unread (reactions are owner-written).
    await dbq(`DELETE FROM app_forum__reactions WHERE target_id=?`, [replyId]);
    const { changed } = await dbq(`DELETE FROM app_forum__replies WHERE id=?`, [replyId]);
    // The hub deletes nothing, without refusing, for a reply the caller may not remove.
    if (changed === 0) throw new Error(refused = "This reply could not be deleted.");
  } catch (e) {
    currentReplies = prevReplies;
    currentThread = prevCurrentThread;
    render();
    if (!refused) console.error(e);
    hubAlert(refused ?? "Couldn’t delete the reply — try again.");
  }
}

// Category management. Each returns whether the write landed, having already
// told the member when it did not.
async function categoryWrite(write, failure) {
  try {
    await write();
    await loadCategories();
    render();
    return true;
  } catch (e) {
    console.error(e);
    hubAlert(failure);
    return false;
  }
}

function saveCategory(id, name, color) {
  const trimmed = name.trim();
  if (!trimmed) { hubAlert("A category needs a name."); return Promise.resolve(false); }
  return categoryWrite(() =>
    dbq(`UPDATE app_forum__categories SET name=?, color=? WHERE id=?`, [trimmed, safeColor(color), id]),
    "Couldn’t save the category — try again.");
}

function addCategory(name, color) {
  return categoryWrite(() => dbq(
    `INSERT INTO app_forum__categories (id, name, color, position, created_at) VALUES (?,?,?,?,?)`,
    [uuid(), name, safeColor(color), categories.length, new Date().toISOString()]
  ), "Couldn’t add the category — try again.");
}

async function deleteCategory(id) {
  if (!await hubConfirm({ message: "Delete this category?", description: "Threads in it will become uncategorised.", confirmLabel: "Delete category", destructive: true })) return false;
  return categoryWrite(async () => {
    await dbq(`UPDATE app_forum__threads SET category_id=NULL WHERE category_id=?`, [id]);
    await dbq(`DELETE FROM app_forum__categories WHERE id=?`, [id]);
    if (categoryFilter === id) {
      categoryFilter = null;
      await loadThreads();
    }
  }, "Couldn’t delete the category — try again.");
}

// ── Modal helpers ─────────────────────────────────────────────────────────────
let modalEl = null;
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  // Programmatic focus works inside cross-origin iframes (unlike the autofocus
  // attribute, which the browser blocks) because it rides the user's click gesture.
  modalEl.querySelector("[data-autofocus]")?.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; previewMode = false; }
window.closeModal = closeModal;

// ── Markdown toolbar helper ───────────────────────────────────────────────────
function wrapSelection(textareaId, before, after = before) {
  const ta = document.getElementById(textareaId);
  if (!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel   = ta.value.slice(start, end) || "text";
  ta.value    = ta.value.slice(0, start) + before + sel + after + ta.value.slice(end);
  ta.focus();
  ta.setSelectionRange(start + before.length, start + before.length + sel.length);
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}
function insertAtCursor(textareaId, text) {
  const ta = document.getElementById(textareaId);
  if (!ta) return;
  const pos  = ta.selectionStart;
  ta.value   = ta.value.slice(0, pos) + text + ta.value.slice(pos);
  ta.focus();
  ta.setSelectionRange(pos + text.length, pos + text.length);
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}
window.mdBold      = id => wrapSelection(id, "**");
window.mdItalic    = id => wrapSelection(id, "*");
window.mdStrike    = id => wrapSelection(id, "~~");
window.mdCode      = id => wrapSelection(id, "`");
window.mdCodeBlock = id => wrapSelection(id, "```\n", "\n```");
window.mdQuote     = id => insertAtCursor(id, "\n> ");
window.mdLink      = id => wrapSelection(id, "[", "](https://)");
window.mdBullet    = id => insertAtCursor(id, "\n- ");

function mdToolbar(textareaId) {
  return `<div class="md-toolbar">
    <button type="button" onclick="mdBold('${textareaId}')"    title="Bold"><b>B</b></button>
    <button type="button" onclick="mdItalic('${textareaId}')"  title="Italic"><i>I</i></button>
    <button type="button" onclick="mdStrike('${textareaId}')"  title="Strikethrough"><s>S</s></button>
    <div class="sep-v"></div>
    <button type="button" onclick="mdCode('${textareaId}')"      title="Inline code">&#96;code&#96;</button>
    <button type="button" onclick="mdCodeBlock('${textareaId}')" title="Code block">{ }</button>
    <div class="sep-v"></div>
    <button type="button" onclick="mdQuote('${textareaId}')"  title="Blockquote">&gt;</button>
    <button type="button" onclick="mdLink('${textareaId}')"   title="Link" aria-label="Link">${glyph("link")}</button>
    <button type="button" onclick="mdBullet('${textareaId}')" title="Bullet list">•</button>
  </div>`;
}

// Row ids and the emoji come from rows any member can write, so they are never
// put inside an inline handler: they ride on escaped data-* attributes and one
// delegated listener reads them (see the ACTIONS table below).
function renderReactionBar(targetId, targetType) {
  const summary = reactionSummary(reactions, targetId);
  const myId    = currentMember?.id ?? "";
  const target  = `data-target="${esc(targetId)}" data-target-type="${esc(targetType)}"`;
  const counts  = summary.map(({ emoji, count }) => {
    const reacted = hasReacted(reactions, targetId, emoji, myId);
    return `<button class="reaction-btn ${reacted ? "reacted" : ""}"
      data-action="react" ${target} data-emoji="${esc(emoji)}">
      ${esc(emoji)} <span>${count}</span>
    </button>`;
  }).join("");

  const showPicker = pickerTarget?.targetId === targetId;
  const picker = showPicker
    ? `<div class="emoji-picker" style="display:inline-flex">
        ${REACTION_EMOJIS.map(e => `
          <button class="emoji-opt" data-action="react" ${target} data-emoji="${esc(e)}">${e}</button>
        `).join("")}
        <button class="emoji-opt" onclick="closePicker()" style="font-size:.8rem;color:var(--muted)" aria-label="Close">${glyph("close")}</button>
      </div>`
    : `<button class="reaction-add" data-action="open-picker" ${target}>+ React</button>`;

  return `<div class="reactions">${counts}${picker}</div>`;
}

let postingThread = false;
window.submitNewThread = async function() {
  const title = document.getElementById("thread-title")?.value?.trim();
  // While previewing, the textarea is not in the page: the text is held on the wrapper.
  const body  = (previewMode
    ? document.getElementById("thread-body-wrap")?.dataset.body
    : document.getElementById("thread-body")?.value)?.trim();
  const catId = document.getElementById("thread-cat")?.value;
  const errEl = document.getElementById("thread-error");

  if (!title) { showError(errEl, "Please add a title."); return; }
  if (!body)  { showError(errEl, "Please write something."); return; }
  errEl.style.display = "none";

  if (postingThread) return;
  const id  = uuid();
  const now = new Date().toISOString();

  // The form stays open until the hub has the thread: a post that fails says
  // so in the form and leaves what was typed in place to send again.
  const postBtn = modalEl?.querySelector(".modal-actions .btn-primary");
  postingThread = true;
  if (postBtn) postBtn.disabled = true;
  try {
    await dbq(
      // `pinned` is left to its default: only adults may write that column.
      `INSERT INTO app_forum__threads (id, title, body, category_id, author_id, author_name, created_at, updated_at)
       VALUES (?,?,?,?,?,?,?,?)`,
      [id, title.trim(), body.trim(), catId || null,
       currentMember.id, currentMember.name, now, now]
    );
  } catch {
    showError(errEl, "Couldn’t post the thread — try again.");
    return;
  } finally {
    postingThread = false;
    if (postBtn) postBtn.disabled = false;
  }

  const newThread = {
    id, title: title.trim(), body: body.trim(),
    category_id: catId || null,
    author_id: currentMember.id, author_name: currentMember.name,
    pinned: false, created_at: now, updated_at: now,
    reply_count: 0, reaction_count: 0,
  };
  threads.unshift(newThread);
  currentThread  = newThread;
  currentReplies = [];
  reactions      = {};
  view           = "thread";
  _replyBodyCache = "";
  replyPreview    = false;
  closeModal();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });

  if (CONTEXT) {
    fetch(`/run/${APP_ID}/api/events`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: "forum.post.created", subject_id: id, payload: { author: currentMember.name, title: title.trim() } }),
    }).catch(() => {});
    fetch(window.__ACTIVITY_URL ?? "/api/activity", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type: "conversation_message_posted",
        actor: currentMember.name,
        description: `${currentMember.name} started a new thread: "${title.trim().slice(0, 60)}"`,
        metadata: { deepLink: { appId: APP_ID, params: { threadId: id } } },
      }),
    }).catch(() => {});
  }
};

window.submitReply = async function() {

  if (!body) { showError(errEl, "Please write something."); return; }
  errEl.style.display = "none";

  const threadId = currentThread.id;
  const id  = uuid();
  const now = new Date().toISOString();

  // Optimistic: append reply locally and clear form immediately
  const optimisticReply = {
    id, thread_id: threadId, body: body.trim(),
    author_id: currentMember.id, author_name: currentMember.name,
    created_at: now,
  };
  currentReplies.push(optimisticReply);
  currentThread = { ...currentThread, reply_count: Number(currentThread.reply_count) + 1 };
  _replyBodyCache = "";
  replyPreview    = false;
  render();
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }), 50);

  try {
    await dbq(
      `INSERT INTO app_forum__replies (id, thread_id, body, author_id, author_name, created_at)
       VALUES (?,?,?,?,?,?)`,
      [id, threadId, body.trim(), currentMember.id, currentMember.name, now]
    );
  } catch (e) {
    // Rollback optimistic update
    currentReplies = currentReplies.filter(r => r.id !== id);
    currentThread = { ...currentThread, reply_count: Number(currentThread.reply_count) - 1 };
    _replyBodyCache = body;
    render();
    console.error(e);
    showError(document.getElementById("reply-error"), "Couldn’t post your reply — try again.");
  }
};

// ── Settings modal ────────────────────────────────────────────────────────────
window.openSettings = function() {
  renderSettingsModal();
};

function renderSettingsModal() {
  const swatches = color => CATEGORY_COLORS.map(c =>
    `<button class="swatch ${c === color ? "selected" : ""}" style="background:${c}"
       data-action="pick-swatch" data-color="${c}"></button>`
  ).join("");

  // One block per category, found again from the clicked control by its
  // data-cat-id: a category id is never part of an element id or a handler.
  const catRows = categories.map(c => `
    <div class="cat-block" data-cat-id="${esc(c.id)}">
      <div class="cat-row">
        <div class="cat-dot" style="background:${safeColor(c.color)}"></div>
        <input class="cat-name-input" value="${esc(c.name)}" aria-label="Category name" />
        <button class="btn btn-xs btn-ghost" data-action="toggle-swatches">Color</button>
        <button class="btn btn-xs btn-danger" style="flex-shrink:0" data-action="delete-category" aria-label="Delete category">${glyph("close", { accent: "currentColor" })}</button>
      </div>
      <div class="cat-swatches" style="display:none;padding:6px 0 8px 18px">
        <div class="color-swatches">${swatches(safeColor(c.color))}</div>
      </div>
    </div>
  `).join("");

  openModal(`
    <h3>${glyph("gear")} Forum Settings</h3>

    <div style="font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:8px">CATEGORIES</div>
    <div id="cat-list">${catRows || "<p style='color:var(--muted);font-size:.85rem'>No categories yet.</p>"}</div>

    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
      <div style="font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:8px">ADD CATEGORY</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" id="new-cat-name" placeholder="Category name"
          style="flex:1;border:1.5px solid var(--border-mid);border-radius:8px;padding:7px 10px;font-size:.88rem;font-family:inherit;outline:none" />
        <button class="btn btn-primary btn-sm" onclick="doAddCategory()">Add</button>
      </div>
      <div class="color-swatches" id="new-cat-swatches" style="margin-top:8px">
        ${CATEGORY_COLORS.map((c, i) =>
          `<button class="swatch ${i === 0 ? "selected" : ""}" style="background:${c}"
             data-action="pick-swatch" data-color="${c}"></button>`
        ).join("")}
      </div>
    </div>

    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
      <div style="font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px">THREAD RETENTION</div>
      <p style="font-size:.82rem;color:var(--muted)">
        Old threads are removed automatically, along with their replies and
        reactions: after 90 days unless that has been changed. Pinned threads
        are always kept. A household admin can change the window — or turn it
        off — under Forum in the hub's app settings.
      </p>
    </div>

    <div class="modal-actions" style="margin-top:14px">
      <button class="btn btn-ghost" onclick="closeModal()">Done</button>
    </div>
  `);
}

function categoryBlock(el) {
  const block = el.closest(".cat-block");
  if (!block) return null;
  return {
    id: block.dataset.catId,
    name: block.querySelector(".cat-name-input")?.value ?? "",
    color: block.querySelector(".swatch.selected")?.dataset.color
      ?? categories.find(c => c.id === block.dataset.catId)?.color,
    swatches: block.querySelector(".cat-swatches"),
    dot: block.querySelector(".cat-dot"),
  };
}

function toggleSwatches(el) {
  const sw = categoryBlock(el)?.swatches;
  if (sw) sw.style.display = sw.style.display === "none" ? "block" : "none";
}

function pickSwatch(btn) {
  btn.closest(".color-swatches").querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
  btn.classList.add("selected");
  const cat = categoryBlock(btn);
  if (!cat) return;                       // the "add category" swatches: nothing to save yet
  cat.dot.style.background = safeColor(cat.color);
  saveCategory(cat.id, cat.name, cat.color);
}

document.addEventListener("change", (e) => {
  if (!e.target.classList?.contains("cat-name-input")) return;
  const cat = categoryBlock(e.target);
  if (cat) saveCategory(cat.id, cat.name, cat.color);
});

window.doAddCategory = async function() {
  const name  = document.getElementById("new-cat-name")?.value?.trim();
  const color = document.querySelector("#new-cat-swatches .swatch.selected")?.dataset.color ?? "#6b7280";
  if (!name) return;
  if (await addCategory(name, color)) renderSettingsModal();
};

// ── Global window actions ─────────────────────────────────────────────────────
async function setCategory(id) {
  categoryFilter = id;
  try {
    if (await loadThreads()) render();
  } catch (e) {
    if (categoryFilter === id) hubAlert(e.message ?? "Could not load threads.");
  }
}

window.openThread = async function(id) { await openThreadById(id); };
async function openThreadById(id) {
  try {
    await loadThread(id);
  } catch (e) {
    hubAlert(e.message ?? "Could not open this thread.");
    return;
  }
  if (!currentThread) {
    hubAlert("This thread is no longer available.");
    return;
  }
  view = "thread";
  _replyBodyCache = "";
  replyPreview    = false;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

window.backToList = async function() {
  view = "list";
  pickerTarget = null;
  await loadThreads();
  render();
};

// Every control that names a row carries data-action plus the row's values as
// data-* attributes. The nearest marked ancestor wins, so a Pin button inside a
// thread card pins without also opening the thread.
const ACTIONS = {
  "open-thread":     el => openThreadById(el.dataset.id),
  "pin":             el => togglePin(el.dataset.id),
  "delete-thread":   el => deleteThread(el.dataset.id),
  "delete-reply":    el => deleteReply(el.dataset.id),
  "set-category":    el => setCategory(el.dataset.id || null),
  "react":           el => toggleReaction(el.dataset.target, el.dataset.targetType, el.dataset.emoji),
  "open-picker":     el => { pickerTarget = { targetId: el.dataset.target, targetType: el.dataset.targetType }; render(); },
  "toggle-swatches": el => toggleSwatches(el),
  "pick-swatch":     el => pickSwatch(el),
  "delete-category": async el => { if (await deleteCategory(categoryBlock(el)?.id)) renderSettingsModal(); },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest?.("[data-action]");
  if (el) ACTIONS[el.dataset.action]?.(el);
});

window.closePicker = function() {
  pickerTarget = null;
  render();
};

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  if (view === "thread" && currentThread) { renderThreadDetail(); return; }
  renderThreadList();
}

function showError(el, msg) {
  if (!el) return;
  el.textContent = msg;
  el.style.display = "block";
}

function renderLoadFailure() {
  document.getElementById("root").innerHTML = `
    <div class="page-header"><h1>Forum</h1></div>
    <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the forum.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
}

// ── Deep link ─────────────────────────────────────────────────────────────────
function handleDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const threadId = params.get("threadId");
  if (threadId) { openThread(threadId); return; }
  // The widget's "+ New thread" button arrives as ?new=1.
  if (params.get("new")) openNewThread();
}

// ── Init ──────────────────────────────────────────────────────────────────────
// Wrapped in a catch: an unhandled rejection here left the page on its
// "Loading…" placeholder forever, with the real cause visible only in a console
// nobody opens. Any failure now renders the failed-load banner with a retry.
async function firstLoad() {
  try {
    await Promise.all([loadMembers(), setupSchema()]);
    await Promise.all([loadCategories(), loadThreads()]);

    if (HUB_MEMBER) {
      currentMember = members.find(m => m.id === HUB_MEMBER.id) ?? {
        id: HUB_MEMBER.id, name: HUB_MEMBER.name, role: HUB_MEMBER.role,
      };
    }
    render();
    handleDeepLink();
  } catch {
    renderLoadFailure();
  }
}
document.addEventListener("click", (e) => {
  if (e.target.closest('[data-testid="load-retry"]')) firstLoad();
});
firstLoad();
</script>
